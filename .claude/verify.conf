# Anosa の検証。CI（.github/workflows/ci.yml）も同じ .claude/scripts/verify run を実行する。
# 仕様: .claude/scripts/verify.md
#
# xcodegen generate は .xcodeproj（git 管理外）と各 Info.plist（コミット済み）を生成する。
# project.yml と Info.plist がずれていると run 中に差分が出て inputs_changed_during_run になる。
check xcodegen          .         xcodegen generate

# AnosaKit のユニットテストはホスト（macOS 26+）で実行する。シミュレータ名に依存しない。
check kit-test          AnosaKit  swift test

# シミュレータ向けビルドは generic destination（scripts/ci/build-scheme.sh）。
# -sdk 指定だと Anosa に埋め込まれた Watch ターゲットまで iOS SDK でビルドされて失敗するため。
# -destination は空白を含み argv に直接書けないのでスクリプトに分けている。
check build-anosa       .         scripts/ci/build-scheme.sh Anosa ios
check build-share       .         scripts/ci/build-scheme.sh AnosaShare ios
check build-widget      .         scripts/ci/build-scheme.sh AnosaWidget ios
check build-watch       .         scripts/ci/build-scheme.sh AnosaWatch watchos
check build-watchwidget .         scripts/ci/build-scheme.sh AnosaWatchWidget watchos
